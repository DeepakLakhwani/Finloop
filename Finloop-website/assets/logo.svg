<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Main gradient for the logo path -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    
    <!-- Shadow effect for premium depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background container (optional, transparent here for versatility) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- The FinLoop Icon: An stylized infinity loop combining a chart upward trend -->
  <g filter="url(#glow)">
    <!-- Main loop path -->
    <path d="M 28,62 
             C 12,62 12,38 28,38 
             C 38,38 48,50 56,58
             C 64,66 74,62 82,54
             C 88,48 88,38 78,38
             C 70,38 60,50 52,58
             C 44,66 38,62 28,62 Z" 
          fill="none" 
          stroke="url(#logo-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Upward arrow indicator inside the loop path to signify growth -->
    <path d="M 75,32 L 85,32 L 85,42" 
          fill="none" 
          stroke="url(#logo-grad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
